<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoard Hopper: a pixel dragon platformer</title>
<meta name="description" content="Hop a little red dragon through four scrolling caves, dodge lava and spikes, scoop up treasure, and pile it onto an ever-growing hoard of gold. Free to play in your browser.">

<meta property="og:site_name" content="Hoard Hopper">
<meta property="og:title" content="Hoard Hopper">
<meta property="og:description" content="A little dragon with big ambitions. Hop through four scrolling caves, dodge lava and spikes, and build a legendary hoard of gold. Free to play in your browser.">
<meta property="og:url" content="https://hoardhopper.synapticnoise.com/">
<meta property="og:image" content="https://hoardhopper.synapticnoise.com/social-card.jpg">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preload" href="fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Press Start 2P (SIL Open Font License, see fonts/OFL.txt), bundled so the game works offline */
  @font-face { font-family: "Press Start 2P"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(fonts/press-start-2p-latin.woff2) format("woff2"); }
  :root { --bg: #0b0708; --fg: #f6d58a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P", monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 0 16px 16px; pointer-events: none; }
  #touch .grp { display: flex; gap: 14px; }
  #touch button { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(246,213,138,.6); background: rgba(40,20,10,.45); color: var(--fg); font: 18px "Press Start 2P", monospace; }
  #touch button.big { width: 88px; height: 88px; }
  body.touch #touch { display: flex; }
  /* Title-screen links. game.js shows them only on the title and lifts them clear of the mute label and touch buttons. */
  .corner { position: fixed; bottom: calc(env(safe-area-inset-bottom) + var(--lift, 10px)); padding: 6px 4px; font: 11px/1 "Press Start 2P", monospace;
    color: #e8d3a0; text-decoration: none; text-shadow: 2px 2px 0 rgba(0,0,0,.75); opacity: .7; touch-action: manipulation; }
  .corner:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: hover) { .corner:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; } }
  .corner[hidden] { display: none; }
  #site-link { left: calc(env(safe-area-inset-left) + 12px); }
  #gh-link { right: calc(env(safe-area-inset-right) + 12px); }
  @media (pointer: coarse), (max-width: 700px) { .corner { font-size: 9px; } }
  /* "Report a bug": top right on the title screen, under the retry prompt on the OUCH! screen (game.js places it). */
  #report-link { bottom: auto; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 12px);
    background: none; border: 0; margin: 0; cursor: pointer; }
  #report-link.on-fail { top: var(--fail-top, 70%); right: auto; left: 50%; transform: translateX(-50%); }
  /* The bug report form, in the game's colours. It must stay selectable so phones can type into it. */
  gh-feedback { -webkit-user-select: text; user-select: text; touch-action: auto;
    --gh-feedback-bg: #24130d; --gh-feedback-text: #f6e2b0; --gh-feedback-border: #6b4426; --gh-feedback-input-bg: #160b07; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="jump" class="big">&#9650;</button></div>
</div>
<a id="site-link" class="corner" href="https://synapticnoise.com/" hidden>synapticnoise.com</a>
<a id="gh-link" class="corner" href="https://github.com/zeveck/hoardhopper" target="_blank" rel="noopener" title="Hoard Hopper on GitHub: how it was made" aria-label="Hoard Hopper on GitHub: how it was made" hidden>GitHub</a>
<button id="report-link" class="corner" type="button" title="Report a bug (Ctrl+Shift+F)" hidden>Report a bug</button>
<gh-feedback id="report" trigger="none" repo="zeveck/hoardhopper" template="bug.yml"
  types="bug,feature" theme="dark" color="#b8461c"></gh-feedback>
<script>
  // Bug reports: Ctrl+Shift+F opens the form from anywhere, even if the game itself has stopped.
  // Set up before the game's code, so an error in the game can't stop it.
  window.reportErrors = [];
  addEventListener('error', (e) => { reportErrors.push(String(e.message).replace(/\s+/g, ' ').slice(0, 200)); reportErrors.splice(0, reportErrors.length - 5); });
  addEventListener('unhandledrejection', (e) => { reportErrors.push(String(e.reason?.message ?? e.reason).replace(/\s+/g, ' ').slice(0, 200)); reportErrors.splice(0, reportErrors.length - 5); });
  addEventListener('keydown', (e) => {
    if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.key.toLowerCase() !== 'f') return;
    const fb = document.getElementById('report');
    if (!fb?.getAttribute('repo') || document.activeElement === fb) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.reportShortcut?.(); } catch {}   // the game freezes, if it still can
    fb.open();
  }, true);
</script>
<script type="module" src="vendor/gh-feedback.js"></script>
<script src="game.js"></script>
<script>
  // Offline play. Skipped on localhost so local edits aren't hidden behind a cache (add ?sw to test it there).
  if ('serviceWorker' in navigator && (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /[?&]sw\b/.test(location.search)))
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
